minimum_cumulusci_version: '4.8.0'
project:
    name: edc-trailblazers
    package:
        name: edc-trailblazers
        api_version: '63.0'
    git:
        default_branch: 'main'
    source_format: sfdx

tasks:
    robot:
        options:
            suites: robot/edc-trailblazers/tests
            options:
                outputdir: robot/edc-trailblazers/results

    robot_testdoc:
        options:
            path: robot/edc-trailblazers/tests
            output: robot/edc-trailblazers/doc/edc-trailblazers_tests.html

    run_tests:
        options:
            required_org_code_coverage_percent: 75
